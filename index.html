<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Jot it down before you forget it.</p>
  </header>

  <main>
    <section class="panel" id="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input type="text" id="note-input" placeholder="Type your note here">
        <select id="note-category" aria-label="Category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section class="panel" id="notes-section">
      <h2>Your notes</h2>
      <input type="search" id="search-input" placeholder="Search notes" aria-label="Search notes">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
      <div id="pagination">
        <button type="button" id="prev-btn">Previous</button>
        <span id="page-info"></span>
        <button type="button" id="next-btn">Next</button>
      </div>
      <button type="button" id="clear-all-btn">Clear all</button>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>
</body>
</html>
